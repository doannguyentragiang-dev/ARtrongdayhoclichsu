<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
<title>AR Chăm Pa Phù Nam</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
<style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; background: #000; }
    
    /* Màn hình chờ ban đầu */
    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
    #loading-container { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px; }
    .loading-text { font-size: 16px; margin-bottom: 20px; line-height: 1.6; color: #f8f9fa; max-width: 85%; }
    .progress-box { width: 280px; height: 18px; background: rgba(255,255,255,0.2); border-radius: 20px; border: 2px solid #fff; overflow: hidden; position: relative; }
    #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FF8C00, #FFD700); transition: width 0.1s ease; }
    #progress-percentage { margin-top: 15px; font-weight: bold; font-size: 22px; color: #FFD700; }

    /* Giao diện các nút bấm */
    .ui-btn { position: fixed; width: 50px; height: 50px; background: white; border-radius: 50%; border: 3px solid #8B4513; color: #8B4513; font-size: 24px; font-weight: bold; z-index: 1000; cursor: pointer; display: none; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #info-btn { top: 20px; right: 20px; }
    #audio-btn { top: 80px; right: 20px; font-size: 20px; }
    #question-btn { top: 140px; right: 20px; background: #fff59d; display: none; }

    #menu-phunam10 { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); gap: 15px; z-index: 2000; flex-direction: row; }
    .num-btn { width: 45px; height: 45px; background: #fff59d; border-radius: 50%; border: 3px solid #8B4513; color: #8B4513; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #back-btn { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 10px 25px; background: #d32f2f; color: white; border-radius: 20px; border: 2px solid white; font-weight: bold; z-index: 2000; cursor: pointer; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10001; justify-content: center; align-items: center; flex-direction: column; }
    .modal-wrapper { position: relative; max-width: 95%; max-height: 85%; }
    #info-content { width: 100%; max-height: 80vh; border-radius: 10px; border: 2px solid white; object-fit: contain; }
    .close-info { position: absolute; top: -15px; right: -15px; width: 40px; height: 40px; border-radius: 50%; background: #d32f2f; color: white; font-weight: bold; font-size: 18px; border: 2px solid white; cursor: pointer; display: flex; justify-content: center; align-items: center; }

    .alert-box { background: white; padding: 25px 30px; border-radius: 10px; text-align: center; color: #8B4513; font-weight: bold; font-size: 18px; border: 3px solid #8B4513; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .alert-close { padding: 10px 20px; background: #d32f2f; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
</style>

<script>
// Bộ điều khiển cảm ứng xoay & phóng to thu nhỏ
AFRAME.registerComponent('gesture-handler', {
schema: { enabled: { default: true }, rotationFactor: { default: 5 }, minScale: { default: 0.1 }, maxScale: { default: 8 } },
init: function () {
this.handleScale = this.handleScale.bind(this);
this.handleRotation = this.handleRotation.bind(this);
this.isVisible = false;
this.initialScale = this.el.object3D.scale.clone();
this.scaleFactor = 1;

const targetEl = this.el.closest('[mindar-image-target]');
if (targetEl) {
    targetEl.addEventListener("targetFound", () => { this.isVisible = true; });
    targetEl.addEventListener("targetLost", () => { this.isVisible = false; });
}
},
update: function () {
this.el.sceneEl.addEventListener("onefingermove", this.handleRotation);
this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
},
handleRotation: function (event) {
if (this.isVisible) {
this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
this.el.object3D.rotation.x += event.detail.positionChange.y * this.data.rotationFactor;
}
},
handleScale: function (event) {
if (this.isVisible) {
this.scaleFactor *= (1 + event.detail.spreadChange / event.detail.startSpread);
this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
}
}
});

AFRAME.registerComponent('gesture-detector', {
init: function () {
this.el.addEventListener('mousedown', (event) => { this.el.emit('rangeStart', event); });
this.el.addEventListener('mousemove', (event) => { this.el.emit('onefingermove', { positionChange: { x: event.movementX / 100, y: event.movementY / 100 } }); });
this.el.addEventListener('touchstart', (event) => {
if(event.touches.length === 2) {
this.startSpread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
}
if(event.touches.length === 1) {
this.lastX = event.touches[0].clientX;
this.lastY = event.touches[0].clientY;
}
});
this.el.addEventListener('touchmove', (event) => {
if (event.touches.length === 1) {
const touch = event.touches[0];
const movementX = touch.clientX - (this.lastX || touch.clientX);
const movementY = touch.clientY - (this.lastY || touch.clientY);
this.lastX = touch.clientX;
this.lastY = touch.clientY;
this.el.emit('onefingermove', { positionChange: { x: movementX / 100, y: movementY / 100 } });
}
if (event.touches.length === 2) {
const spread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
const spreadChange = spread - this.startSpread;
this.el.emit('twofingermove', { spreadChange: spreadChange, startSpread: this.startSpread });
this.startSpread = spread;
}
});
}
});

// Bộ tách nền xanh chuẩn màu #06dd01
AFRAME.registerComponent('chromakey', {
schema: {
src: { type: 'selector' },
color: { type: 'color', default: '#06dd01' }
},
init: function () {
const videoEl = this.data.src;
if (!videoEl) return;
const color = new THREE.Color(this.data.color);
this.texture = new THREE.VideoTexture(videoEl);
this.texture.minFilter = THREE.LinearFilter;
this.texture.format = THREE.RGBAFormat;

this.material = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: {
        map: { value: this.texture },
        keyColor: { value: color },
        similarity: { value: 0.4 },
        smoothness: { value: 0.1 }
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        uniform sampler2D map; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
        void main() {
            vec4 texColor = texture2D(map, vUv);
            float d = distance(texColor.rgb, keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, d);
            gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
        }
    `
});
this.el.addEventListener('loaded', () => {
    const mesh = this.el.getObject3D('mesh');
    if (mesh) mesh.material = this.material;
});
}
});
</script>
</head>

<body style="margin: 0; overflow: hidden;">

<!-- Màn hình chờ thanh tiến độ -->
<div id="start-screen">
    <div id="loading-container">
        <div class="loading-text">Dữ liệu nhiều, bạn cố gắng đợi mình chút nhé!</div>
        <div class="progress-box"><div id="progress-bar"></div></div>
        <div id="progress-percentage">0%</div>
    </div>
</div>

<div id="info-btn" class="ui-btn">ℹ️</div>
<div id="audio-btn" class="ui-btn">🔊</div>
<div id="question-btn" class="ui-btn">❓</div>

<div id="menu-phunam10">
    <div class="num-btn" id="btn-1">1</div>
    <div class="num-btn" id="btn-2">2</div>
    <div class="num-btn" id="btn-3">3</div>
    <div class="num-btn" id="btn-4">4</div>
</div>
<button id="back-btn">QUAY LẠI VIDEO</button>

<div id="info-modal" class="modal">
    <div class="modal-wrapper">
        <img id="info-content" src="" alt="Thông tin">
        <button class="close-info" id="close-info">✕</button>
    </div>
</div>

<div id="custom-alert" class="modal">
    <div class="alert-box">
        <div id="alert-msg">Dữ liệu đang cập nhật</div>
        <button class="alert-close" id="close-alert">Đóng ✕</button>
    </div>
</div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" gesture-detector>
    
    <a-assets>
        <a-asset-item id="champa10" src="./champa10.glb"></a-asset-item>
        <a-asset-item id="champa11" src="./champa11.glb"></a-asset-item>
        <a-asset-item id="champa13" src="./champa13.glb"></a-asset-item>
        <a-asset-item id="phunam8" src="./phunam8.glb"></a-asset-item>
        <a-asset-item id="phunam9" src="./phunam9.glb"></a-asset-item>
        <a-asset-item id="vanlang8" src="./vanlang8.glb"></a-asset-item>
        
        <a-asset-item id="m-10a" src="./phunam10a.glb"></a-asset-item>
        <a-asset-item id="m-10b" src="./phunam10b.glb"></a-asset-item>
        <a-asset-item id="m-10c" src="./phunam10c.glb"></a-asset-item>

        <video id="v-phunam10" src="./phunam10.mp4" playsinline webkit-playsinline muted loop></video>
        <video id="v-phunam11" src="./phunam11.mp4" playsinline webkit-playsinline muted loop></video>
        <audio id="a-vanlang8" src="./vanlang8.mp3" preload="auto"></audio>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="2.5"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.5" position="1 3 2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.0" position="-1 -1 -1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="t0" mindar-image-target="targetIndex: 0"><a-entity gltf-model="#champa10" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex: 1"><a-entity gltf-model="#champa11" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex: 2"><a-entity gltf-model="#champa13" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity></a-entity>
    <a-entity id="t3" mindar-image-target="targetIndex: 3"><a-entity gltf-model="#phunam8" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity></a-entity>
    <a-entity id="t4" mindar-image-target="targetIndex: 4"><a-entity gltf-model="#phunam9" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity></a-entity>

    <a-entity id="t5" mindar-image-target="targetIndex: 5">
        <a-plane id="video-5" chromakey="src: #v-phunam10; color: #06dd01" position="0 0 0" height="1.5" width="1.1" rotation="0 0 0"></a-plane>
        <a-entity id="model-10a" gltf-model="#m-10a" scale="1 1 1" rotation="90 0 0" visible="false" gesture-handler></a-entity>
        <a-entity id="model-10b" gltf-model="#m-10b" scale="1 1 1" rotation="90 0 0" visible="false" gesture-handler></a-entity>
        <a-entity id="model-10c" gltf-model="#m-10c" scale="1 1 1" rotation="90 0 0" visible="false" gesture-handler></a-entity>
    </a-entity>

    <a-entity id="t6" mindar-image-target="targetIndex: 6">
        <a-plane id="video-6" chromakey="src: #v-phunam11; color: #06dd01" position="0 0 0" height="1.5" width="1.1" rotation="0 0 0"></a-plane>
    </a-entity>

    <a-entity id="t7" mindar-image-target="targetIndex: 7">
        <a-entity id="model-vanlang8" gltf-model="#vanlang8" scale="1 1 1" rotation="90 0 0" gesture-handler></a-entity>
    </a-entity>

</a-scene>

<script>
    // Thanh tiến độ chạy từ 1-100%
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-percentage');
    const startScreen = document.getElementById('start-screen');

    let loadProgress = 0;
    let progressInterval = setInterval(() => {
        loadProgress += 2;
        if (loadProgress >= 100) {
            loadProgress = 100;
            clearInterval(progressInterval);
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 300);
        }
        progressBar.style.width = loadProgress + '%';
        progressText.innerText = loadProgress + '%';
    }, 40);

    const infoBtn = document.getElementById('info-btn');
    const audioBtn = document.getElementById('audio-btn');
    const questionBtn = document.getElementById('question-btn');
    const infoModal = document.getElementById('info-modal');
    const infoContent = document.getElementById('info-content');
    const customAlert = document.getElementById('custom-alert');
    const alertMsg = document.getElementById('alert-msg');

    const menuPhunam10 = document.querySelector('#menu-phunam10');
    const backBtn = document.querySelector('#back-btn');
    
    const v10 = document.querySelector('#v-phunam10');
    const v11 = document.querySelector('#v-phunam11');
    const aud8 = document.querySelector('#a-vanlang8');

    const video5 = document.querySelector('#video-5');
    const video6 = document.querySelector('#video-6');
    const modelVanlang8 = document.querySelector('#model-vanlang8');

    const m10a = document.querySelector('#model-10a');
    const m10b = document.querySelector('#model-10b');
    const m10c = document.querySelector('#model-10c');

    const infoImages = ['ttchampa10.png', 'ttchampa11.png', 'ttchampa13.png', 'ttphunam8.png', 'ttphunam9.png', 'ttphunam10.png', 'ttphunam11.png', 'ttvanlang8b.png'];

    let activeIdx = -1;
    let isAudioPlaying = false;
    let currentSubModel = null;
    let isQuestionOpen = false;

    function hideAllModels() {
        m10a.setAttribute('visible', 'false');
        m10b.setAttribute('visible', 'false');
        m10c.setAttribute('visible', 'false');
    }

    function resetAll() {
        v10.pause(); v11.pause(); aud8.pause(); aud8.currentTime = 0;
        isAudioPlaying = false;
        audioBtn.innerText = '🔊';
        
        infoBtn.style.display = 'none';
        audioBtn.style.display = 'none';
        questionBtn.style.display = 'none';
        menuPhunam10.style.display = 'none';
        backBtn.style.display = 'none';
        infoModal.style.display = 'none';
        customAlert.style.display = 'none';

        video5.setAttribute('visible', 'true');
        video6.setAttribute('visible', 'true');
        modelVanlang8.setAttribute('visible', 'true');
        hideAllModels();
        currentSubModel = null;
        isQuestionOpen = false;
    }

    for (let i = 0; i < 8; i++) {
        const entity = document.getElementById(`t${i}`);
        if (!entity) continue;

        entity.addEventListener("targetFound", () => {
            if (activeIdx !== i) resetAll();
            activeIdx = i;

            infoBtn.style.display = 'flex';
            audioBtn.style.display = 'flex';

            if (i === 5) {
                v10.play().catch(()=>{});
                menuPhunam10.style.display = 'flex';
            } else if (i === 6) {
                v11.play().catch(()=>{});
            } else if (i === 7) {
                questionBtn.style.display = 'flex'; // Hiển thị nút ? ở hình 8
            }
        });

        entity.addEventListener("targetLost", () => {
            if (activeIdx === i) {
                resetAll();
                activeIdx = -1;
            }
        });
    }

    infoBtn.addEventListener('click', () => {
        if (activeIdx === -1) return;

        v10.pause();
        v11.pause();
        aud8.pause();

        infoContent.src = `./${infoImages[activeIdx]}`;
        infoModal.style.display = 'flex';
    });

    // Nút hỏi chấm (?) ở hình 8
    questionBtn.addEventListener('click', () => {
        if (activeIdx !== 7) return;

        aud8.pause();
        modelVanlang8.setAttribute('visible', 'false'); // Ẩn mô hình trống đồng

        infoContent.src = `./ttvanlang8a.png`;
        infoModal.style.display = 'flex';
        isQuestionOpen = true;
    });

    document.getElementById('close-info').addEventListener('click', () => {
        infoModal.style.display = 'none';

        if (activeIdx === 5) {
            if (currentSubModel) {
                modelMap[currentSubModel].setAttribute('visible', 'true');
            } else {
                video5.setAttribute('visible', 'true');
                v10.play().catch(()=>{});
            }
        } else if (activeIdx === 6) {
            video6.setAttribute('visible', 'true');
            v11.play().catch(()=>{});
        } else if (activeIdx === 7) {
            if (isQuestionOpen) {
                modelVanlang8.setAttribute('visible', 'true'); // Hiện lại trống đồng
                isQuestionOpen = false;
            }
        }

        if (isAudioPlaying && activeIdx === 7) {
            aud8.play().catch(()=>{});
        }
    });

    audioBtn.addEventListener('click', () => {
        if (activeIdx === -1) return;

        if (activeIdx !== 7) {
            alertMsg.innerText = "Dữ liệu đang cập nhật";
            customAlert.style.display = 'flex';
            return;
        }

        isAudioPlaying = !isAudioPlaying;
        audioBtn.innerText = isAudioPlaying ? '🎵' : '🔊';

        if (isAudioPlaying) {
            aud8.play().catch(()=>{});
        } else {
            aud8.pause();
        }
    });

    document.getElementById('close-alert').addEventListener('click', () => {
        customAlert.style.display = 'none';
    });

    const modelMap = { '1': m10a, '2': m10b, '3': m10c, '4': m10c };

    ['1', '2', '3', '4'].forEach(num => {
        document.getElementById(`btn-${num}`).addEventListener('click', () => {
            v10.pause();
            video5.setAttribute('visible', 'false'); 
            hideAllModels();
            
            modelMap[num].setAttribute('visible', 'true');
            currentSubModel = num;
            
            menuPhunam10.style.display = 'none';
            backBtn.style.display = 'block';
        });
    });

    backBtn.addEventListener('click', () => {
        hideAllModels();
        video5.setAttribute('visible', 'true'); 
        v10.play().catch(()=>{});
        currentSubModel = null;
        backBtn.style.display = 'none';
        menuPhunam10.style.display = 'flex';
    });
</script>

</body>
</html>
